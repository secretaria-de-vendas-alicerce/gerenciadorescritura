<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alicerce — Gerenciador de Escrituras</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#f4f4f5">
  <meta name="description" content="Gerenciador de Escrituras — Alicerce Consultoria.">
  <!--
    WRAPPER ANTI /u/N/ — por que este arquivo existe
    -------------------------------------------------
    O web app do Apps Script e servido em script.google.com/macros/s/.../exec.
    Quando o visitante tem 2+ contas Google logadas, o Google redireciona a /exec
    para /u/1/, /u/2/... chuta o indice errado e mostra "Nao foi possivel abrir o
    arquivo". Carregando a MESMA /exec dentro de um <iframe> a partir de um dominio
    que NAO e google.com, o Google entrega o app como sub-recurso e nao roda esse
    roteador de conta — abre igual em qualquer navegador, com qualquer conta.

    Acesso anonimo (ANYONE_ANONYMOUS) sozinho NAO resolve: o Cadastro de Imoveis,
    tambem anonimo, so ficou estavel com este wrapper. A identidade do operador vem
    do LOGIN DO PROPRIO APP (usuario+senha), nao da conta Google.

    Pre-requisitos (ja feitos no app):
      - Implantacao: "Executar como: Eu" + "Quem pode acessar: Qualquer pessoa".
      - doGet(): setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL).

    COMO USAR:
      1. A URL /exec completa ja esta no src do iframe abaixo.
      2. Hospede este arquivo em qualquer dominio fora do google.com
         (GitHub Pages: index.html na raiz + .nojekyll vazio; repo publico).
      3. Compartilhe o link DESTA pagina — nunca mais a /exec direta.
  -->
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: #0f1115; }
    /* iframe ocupa o viewport inteiro, respeitando notch no mobile */
    #app {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; display: block;
    }
    #fallback {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center; padding: 24px;
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #e6e8eb; text-align: center;
    }
    #fallback a { color: #7aa2ff; }
    .loading {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      font: 14px system-ui, sans-serif; color: #8b94a3;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">Carregando o gerenciador…</div>

  <!--
    credentialless: carrega o iframe num contexto efemero, SEM enviar os cookies
    de sessao do Google (igual a uma aba anonima). E isso que contorna o roteador
    de conta /u/N/ — com cookies, o Google tenta "adivinhar" a conta dentro do
    frame e quebra; sem cookies, serve anonimo e abre. Suportado em Chromium
    (Chrome/Edge 110+). Firefox/Safari ignoram o atributo (fallback: link direto).
  -->
  <iframe
    id="app"
    credentialless
    src="https://script.google.com/macros/s/AKfycbzcY8QVTyQTcJPs3q5Ph73OUxOQ1_pFhQlkwor34RDK1qvVvIrkoyNGh25_IDhTTich/exec"
    title="Alicerce — Gerenciador de Escrituras"
    allow="clipboard-write; clipboard-read; fullscreen"
    referrerpolicy="no-referrer"
    onload="document.getElementById('loading').style.display='none'"></iframe>

  <div id="fallback">
    <div>
      <p><strong>Nao foi possivel carregar.</strong></p>
      <p>Abra o link diretamente:
        <a id="directLink" href="https://script.google.com/macros/s/AKfycbzcY8QVTyQTcJPs3q5Ph73OUxOQ1_pFhQlkwor34RDK1qvVvIrkoyNGh25_IDhTTich/exec" target="_blank" rel="noopener">abrir o sistema</a>.
      </p>
    </div>
  </div>

  <script>
    // Se o iframe nao sinalizar load em ~12s, oferece o link direto como rede de seguranca.
    setTimeout(function () {
      var ld = document.getElementById('loading');
      if (ld && ld.style.display !== 'none') {
        ld.style.display = 'none';
        document.getElementById('fallback').style.display = 'flex';
      }
    }, 12000);
  </script>
  <script>
    /* PONTE DO CÓDIGO (ORD-PERF-ESCRITURAS-002, O1). O app baixa o código de todas as telas enquanto a pessoa digita a senha
       e guarda AQUI: o localStorage de dentro do iframe credentialless some ao recarregar, o desta página fica. O app roda o
       guardado só se o sha256 for o do build dele: este storage é de todo o github.io da conta.
       PONTE DA SESSÃO (O3, A8; molde: o L-1 do Imóveis, CONSELHO-015): o token da sessão também mora aqui, para recarregar
       não pedir a senha. O app só mostra a tela depois de o servidor conferir o token (`retomar`); o Sair o apaga daqui e do
       servidor. Sem esta página, ou com outro host, o app pede a senha (falha segura). */
    (function () {
      var CODIGO = 'esc-codigo';
      var SESSAO = 'esc-sessao';
      var app = document.getElementById('app');
      var TIPOS = { 'esc-codigo-get': 1, 'esc-codigo-set': 1, 'esc-sessao-get': 1, 'esc-sessao-set': 1 };
      /* o formato: tipo conhecido; o valor, quando vem, é texto. O código leva a chave curta e sem símbolo; o token gravado
         é o uuid do servidor, ou vazio (apagar) */
      function noFormato(d) {
        if (!d || typeof d !== 'object' || !TIPOS[d.tipo]) return false;
        if (d.value !== undefined && typeof d.value !== 'string') return false;
        if (d.tipo === 'esc-sessao-get') return true;
        if (d.tipo === 'esc-sessao-set') return !d.value || /^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(d.value);
        return typeof d.chave === 'string' && /^[\w.-]{1,80}$/.test(d.chave);
      }
      /* A página do app roda no host de script DESTE projeto: n-<o id dele>-0lu-script.googleusercontent.com, o mesmo nas 3
         aberturas medidas pelo wrapper em 23/11 (@44). O número antes do "lu" fica aberto, como no Análises v3: não está medido se
         ele muda. Projeto novo = host novo: o app baixa o código a cada entrada (falha segura) até este id ser trocado aqui */
      function doGoogle(origem) {
        return /^https:\/\/n-uvbhw3n6mxhpqred2z64t4h7sqg5fhtazmluk2i-\d+lu-script\.googleusercontent\.com$/.test(origem);
      }
      /* e mora 2 frames abaixo do iframe: /exec -> painel -> página (medido em 23/11). Se o Google mudar isso, o app baixa o código */
      function doIframe(w) {
        var p = w && w.parent;
        return !!p && p !== w && p.parent === app.contentWindow;
      }
      window.addEventListener('message', function (ev) {
        if (!doIframe(ev.source) || !doGoogle(ev.origin) || !noFormato(ev.data)) return;
        var d = ev.data;
        try {
          if (d.tipo === 'esc-sessao-get') {
            ev.source.postMessage({ tipo: 'esc-sessao-value', value: localStorage.getItem(SESSAO) || '' }, ev.origin);
          } else if (d.tipo === 'esc-sessao-set') {
            if (d.value) localStorage.setItem(SESSAO, d.value); else localStorage.removeItem(SESSAO);
          } else if (d.tipo === 'esc-codigo-get') {
            var g = JSON.parse(localStorage.getItem(CODIGO) || 'null');
            ev.source.postMessage({ tipo: 'esc-codigo-value', value: g && g.chave === d.chave ? g.value : '' }, ev.origin);
          } else if (typeof d.value === 'string' && d.value) {
            localStorage.setItem(CODIGO, JSON.stringify({ chave: d.chave, value: d.value }));
          } else {
            localStorage.removeItem(CODIGO);
          }
        } catch (e) {
          /* sem armazenamento (aba anônima, bloqueio) ou cheio: o app baixa o código e pede a senha */
          if (d.tipo === 'esc-codigo-get') ev.source.postMessage({ tipo: 'esc-codigo-value', value: '' }, ev.origin);
          if (d.tipo === 'esc-sessao-get') ev.source.postMessage({ tipo: 'esc-sessao-value', value: '' }, ev.origin);
        }
      });
    })();
  </script>
</body>
</html>
